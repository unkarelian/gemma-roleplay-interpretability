<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Gemma role-play explorer</title>
<script>
  // Load the API mock only when ?mock=1 (synchronously, before the app starts).
  if (/[?&]mock=1(&|$)/.test(location.search)) document.write('<script src="mock.js"><\/script>');
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb; --surface2: #f0efec; --surface3: #e7e6e1;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #77756f;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.12);
  --accent: #2a78d6; --accent-ink: #fff; --danger: #d03b3b; --good: #006300;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s7: #6250d6;
  --r-system: 98,80,214; --r-user: 27,175,122; --r-assistant: 232,123,164; --r-template: 137,135,129; --r-prefix: 237,161,0; --r-generated: 235,104,52;
  --shadow: 0 6px 24px rgba(0,0,0,.12);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --nav-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface2: #242422; --surface3: #2f2f2c;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #95938c;
    --grid: #2c2c2a; --axis: #45453f; --border: rgba(255,255,255,.11);
    --accent: #3987e5; --accent-ink: #fff; --good: #0ca30c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s7: #9085e9;
    --r-system: 144,133,233; --r-user: 25,158,112; --r-assistant: 213,81,129; --r-template: 137,135,129; --r-prefix: 201,133,0; --r-generated: 217,89,38;
    --shadow: 0 6px 24px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h2 { font-size: 17px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 0 0 6px; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- layout ---------- */
header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--border); }
header .brand { font-weight: 650; white-space: nowrap; }
header .brand span { color: var(--muted); font-weight: 450; }
#runchip { margin-left: auto; min-width: 0; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px; background: var(--surface2); cursor: pointer; font-size: 13px; }
nav#nav { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: flex; overflow-x: auto; background: var(--surface); border-top: 1px solid var(--border); scrollbar-width: none; }
nav#nav::-webkit-scrollbar { display: none; }
nav#nav button { flex: 1 0 auto; min-width: 68px; border: 0; background: none; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink2); font-size: 12px; cursor: pointer; }
nav#nav button .ic { font-size: 16px; line-height: 1; font-family: var(--mono); }
nav#nav button.active { color: var(--accent); font-weight: 600; box-shadow: inset 0 3px 0 var(--accent); }
main { padding: 12px; padding-bottom: calc(var(--nav-h) + 80px + env(safe-area-inset-bottom)); max-width: 1500px; margin: 0 auto; }
@media (min-width: 900px) {
  nav#nav { top: 0; bottom: 0; right: auto; width: 150px; height: auto; flex-direction: column; border-top: 0; border-right: 1px solid var(--border); padding-top: 56px; overflow-y: auto; }
  nav#nav button { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 10px; padding: 11px 16px; font-size: 14px; min-width: 0; }
  nav#nav button.active { box-shadow: inset 3px 0 0 var(--accent); background: var(--surface2); }
  header { padding-left: 16px; z-index: 40; }
  main { margin-left: 150px; padding: 16px 20px 90px; }
  body.cell-open main { margin-right: min(520px, 42vw); }
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.tight { gap: 4px; }
.grow { flex: 1 1 auto; min-width: 0; }
.cols { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 1100px) { .cols.two { grid-template-columns: 1fr 1fr; } }

/* ---------- controls ---------- */
.btn { border: 1px solid var(--border); background: var(--surface2); border-radius: 9px; padding: 0 12px; min-height: 38px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; touch-action: manipulation; }
.btn:hover { background: var(--surface3); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { min-height: 32px; padding: 0 9px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 38px; padding: 0; }
.btn.sm.icon { width: 32px; }
.btn.ghost { background: none; }
.btn.danger { color: var(--danger); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface2); padding: 0 11px; min-height: 34px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
select, input[type=text], input[type=number], input[type=search], textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 9px; min-height: 38px; max-width: 100%; }
select { padding-right: 6px; }
textarea { width: 100%; resize: vertical; min-height: 64px; line-height: 1.4; }
input[type=number] { width: 88px; }
input[type=range] { accent-color: var(--accent); min-height: 30px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--ink2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface2); color: var(--ink2); white-space: nowrap; vertical-align: 1px; }
.badge.atlas { border-color: rgba(var(--r-system), .5); color: rgb(var(--r-system)); }
.badge.gemmascope { border-color: rgba(var(--r-user), .5); color: rgb(var(--r-user)); }
.badge.ours { border-color: rgba(var(--r-generated), .55); color: rgb(var(--r-generated)); }
.badge.v16 { border-color: rgba(var(--r-assistant), .55); color: rgb(var(--r-assistant)); }
.badge.neuronpedia { border-color: rgba(var(--r-prefix), .55); color: rgb(var(--r-prefix)); }
details.about summary { cursor: pointer; font-weight: 600; }
details.about ul { margin: 6px 0 0; padding-left: 18px; }
details.about li { margin: 4px 0; font-size: 13.5px; }
details.about .big { color: var(--ink2); font-size: 12.5px; }
.desc { font-size: 13px; color: var(--ink2); margin: 6px 0 0; }
.empty { text-align: center; padding: 40px 16px; color: var(--ink2); }

/* ---------- prompt builder ---------- */
.msg { border: 1px solid var(--border); border-left: 4px solid rgb(var(--rc, 137,135,129)); border-radius: 10px; padding: 8px; margin-bottom: 8px; background: var(--surface); }
.msg .row { margin-bottom: 6px; }
.msg[data-role=system] { --rc: var(--r-system); }
.msg[data-role=user] { --rc: var(--r-user); }
.msg[data-role=assistant] { --rc: var(--r-assistant); }
.steer { border: 1px dashed var(--border); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
.steer input[type=range] { flex: 1 1 140px; }
.reply { white-space: pre-wrap; background: var(--surface2); border-radius: 10px; padding: 10px; font-size: 14.5px; }
.reply .pre { color: var(--muted); }

/* ---------- token strip ---------- */
.strip { font-family: var(--mono); font-size: 13.5px; line-height: 1.95; white-space: pre-wrap; word-break: break-word; max-height: 46vh; overflow-y: auto; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; -webkit-tap-highlight-color: transparent; }
.strip.short { max-height: none; }
.tk { cursor: pointer; border-radius: 3px; padding: 1px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.tk:hover { outline: 1px solid var(--axis); }
.tk.tpl { color: var(--muted); font-size: 11px; }
.tk.gen { border-bottom: 2px solid rgb(var(--r-generated)); }
.tk.pre { border-bottom: 2px dotted rgb(var(--r-prefix)); }
.tk.sel { outline: 2px solid var(--ink) !important; outline-offset: 1px; position: relative; z-index: 1; }
.rolechip { font-family: system-ui, sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 0 5px; margin: 0 3px; border-radius: 4px; color: rgb(var(--rc)); border: 1px solid rgba(var(--rc), .5); vertical-align: 2px; user-select: none; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); flex-wrap: wrap; }
.legend .ramp { width: 160px; height: 10px; border-radius: 3px; border: 1px solid var(--border); }
.legend .key { display: inline-flex; align-items: center; gap: 5px; }
.legend .sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend .box { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.selbar { position: sticky; top: 52px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.05); }
.selbar .tokname { font-family: var(--mono); background: var(--surface2); border-radius: 5px; padding: 1px 6px; white-space: pre; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }
.selbar .val { font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------- charts ---------- */
.chart { width: 100%; position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
.chart text.lab { fill: var(--ink2); font-size: 11.5px; font-weight: 600; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .selline { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; }
.chart .cross { stroke: var(--ink2); stroke-width: 1; pointer-events: none; }
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 9px; padding: 7px 9px; font-size: 12.5px; max-width: 300px; display: none; }
#tip .tv { font-weight: 650; font-variant-numeric: tabular-nums; }
#tip .tr { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#tip .tr .sw { width: 12px; height: 2px; display: inline-block; border-radius: 1px; }
#tip .tt { font-family: var(--mono); white-space: pre; }

/* ---------- heatmap ---------- */
.heatwrap { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.heatlabels { flex: 0 0 38px; position: relative; border-right: 1px solid var(--border); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.heatlabels div { position: absolute; right: 5px; display: flex; align-items: center; }
.heatlabels div.on { color: var(--ink); font-weight: 700; }
.heatscroll { overflow-x: auto; overflow-y: hidden; flex: 1 1 auto; -webkit-overflow-scrolling: touch; }
.heatscroll canvas { display: block; cursor: crosshair; touch-action: pan-x pan-y; }

/* ---------- cell panel ---------- */
#cell { position: fixed; z-index: 50; inset: 0; background: var(--bg); display: flex; flex-direction: column; transform: translateY(102%); transition: transform .22s ease; }
#cell.open { transform: none; }
@media (min-width: 900px) {
  #cell { left: auto; width: min(520px, 42vw); top: 0; border-left: 1px solid var(--border); box-shadow: var(--shadow); transform: translateX(102%); }
}
#cell .chead { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
#cell .cbody { overflow-y: auto; padding: 12px; flex: 1 1 auto; padding-bottom: 90px; }
#cell .section { margin-bottom: 18px; }
.feat { border-bottom: 1px solid var(--border); padding: 8px 2px; cursor: pointer; }
.feat:last-child { border-bottom: 0; }
.feat .top { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.feat .lbl { font-weight: 600; }
.feat .key { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.feat .snip { font-size: 12.5px; color: var(--ink2); margin-top: 3px; font-family: var(--mono); word-break: break-word; }
mark { background: rgba(var(--r-prefix), .35); color: inherit; border-radius: 3px; padding: 0 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--border); white-space: pre; }
.hbar { height: 6px; border-radius: 0 3px 3px 0; background: var(--s1); margin-top: 4px; min-width: 2px; }
.blist .bi { display: grid; grid-template-columns: minmax(70px, 34%) 1fr 56px; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
.blist .bi .t { font-family: var(--mono); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.blist .bi .bar { height: 10px; border-radius: 0 3px 3px 0; background: var(--s1); min-width: 2px; }
.blist .bi .bar.alt { background: var(--axis); }
.blist .bi .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
.blist .bi.click { cursor: pointer; border-radius: 6px; }
.blist .bi.click:hover { background: var(--surface2); }
.blist .bi.chosen .t { font-weight: 700; }
.axgrid { display: grid; grid-template-columns: 80px 1fr 56px; gap: 6px 8px; align-items: center; font-size: 13px; }
.axtrack { height: 10px; background: var(--surface2); border-radius: 3px; position: relative; overflow: hidden; }
.axtrack i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 0 3px 3px 0; }
.attstrip { font-family: var(--mono); font-size: 12.5px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; max-height: 36vh; overflow-y: auto; padding: 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.attstrip span { border-radius: 3px; cursor: pointer; }
.attstrip span.q { outline: 2px solid var(--ink); }

/* ---------- tables ---------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl tr.grp td { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding-top: 10px; }
.tblwrap { overflow-x: auto; }
.pos { color: rgb(var(--r-generated)); }
.neg { color: var(--s1); }
.diffbar { display: inline-block; height: 8px; border-radius: 2px; vertical-align: middle; margin-left: 4px; }

/* ---------- steps ---------- */
.stepnav { display: flex; align-items: center; gap: 8px; }
.stepnav input[type=range] { flex: 1 1 auto; }
.steptext { font-family: var(--mono); font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; max-height: 32vh; overflow-y: auto; }
.steptext .ctx { color: var(--muted); }
.steptext .cur { background: rgba(var(--r-generated), .3); outline: 2px solid rgb(var(--r-generated)); border-radius: 3px; }
.lensgrid td.hit { font-weight: 700; color: rgb(var(--r-generated)); }

/* ---------- watch ---------- */
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.wcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px 6px; }
.wcard .wl { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.wcard .wk { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.wcard svg { display: block; width: 100%; height: 54px; margin-top: 4px; cursor: crosshair; touch-action: pan-y; }
.wcard .wfoot { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); gap: 6px; }

/* ---------- runs & notes ---------- */
.item { padding: 9px 4px; border-bottom: 1px solid var(--border); }
.item:last-child { border-bottom: 0; }
.item.cur { background: var(--surface2); border-radius: 8px; padding-left: 8px; }
.item .meta { font-size: 12px; color: var(--muted); }
.item .txt { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }

/* ---------- FAB, dialogs, toast ---------- */
#fab { position: fixed; z-index: 45; right: 14px; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom)); border-radius: 99px; min-height: 48px; padding: 0 18px; box-shadow: var(--shadow); }
@media (min-width: 900px) { #toast { bottom: 84px; } #fab { bottom: 20px; right: 20px; } body.cell-open #fab { right: calc(min(520px, 42vw) + 20px); } }
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
.modal .sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
@media (min-width: 700px) { .modal { align-items: center; } .modal .sheet { border-radius: 14px; } }
#toast { position: fixed; z-index: 120; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 76px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13.5px; box-shadow: var(--shadow); max-width: 90vw; display: none; }
#toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<header>
  <div class="brand">Gemma Explorer <span class="small">3 4B-it · role-play &amp; safety</span></div>
  <button id="runchip" title="Current run - tap to open Runs">no run</button>
</header>
<nav id="nav"></nav>
<main id="main">
  <section id="v-prompt" data-view></section>
  <section id="v-tokens" data-view class="hidden"></section>
  <section id="v-heat" data-view class="hidden"></section>
  <section id="v-steps" data-view class="hidden"></section>
  <section id="v-watch" data-view class="hidden"></section>
  <section id="v-compare" data-view class="hidden"></section>
  <section id="v-runs" data-view class="hidden"></section>
</main>
<aside id="cell" aria-label="Cell detail"></aside>
<button id="fab" class="btn primary" title="Write a note about what you are looking at (captures the current view)">+ Note</button>
<div id="tip"></div>
<div id="toast"></div>

<script>
'use strict';
/* ====================================================================
   Utilities
   ==================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
const showTok = (s) => String(s == null ? '' : s).replace(/\n/g, '↵').replace(/\t/g, '⇥').replace(/ /g, '·');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const isNum = (v) => typeof v === 'number' && isFinite(v);
function fmt(v, d) {
  if (!isNum(v)) return '–';
  const a = Math.abs(v);
  if (d != null) return v.toFixed(d);
  if (a >= 1000) return v.toFixed(0);
  if (a >= 100) return v.toFixed(1);
  if (a >= 10) return v.toFixed(2);
  return v.toFixed(3);
}
const pct = (p) => isNum(p) ? (p * 100).toFixed(p >= 0.1 ? 0 : 1) + '%' : '–';
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

  for (const p of probeDefs(null)) rows.push({ g: 'Axes @L' + S.cmp.layer, name: p.id + probeTag(p), va: probeVals(A, p.id), vb: probeVals(B, p.id) });
  const keys = Array.from(new Set([...Object.keys(A.watch || {}), ...Object.keys(B.watch || {})]));
  const wrows = keys.map((k) => ({ g: 'Watched', name: watchInfo(k).label, key: k, va: (A.watch || {})[k], vb: (B.watch || {})[k] }));
  const calc = (r) => { const sa = stats(r.va, A), sb = stats(r.vb, B); return { ...r, sa, sb, dmax: isNum(sa.max) && isNum(sb.max) ? sb.max - sa.max : null, dmean: isNum(sa.mean) && isNum(sb.mean) ? sb.mean - sa.mean : null }; };
  const ax = rows.map(calc); const wf = wrows.map(calc).sort((x, y) => Math.abs(y.dmax || 0) - Math.abs(x.dmax || 0));
  const maxD = Math.max(1e-9, ...wf.map((r) => Math.abs(r.dmax || 0)));
  const tb = h('tbody');
  const addRows = (list, scaleD) => {
    let lastG = null;
    for (const r of list) {
      if (r.g !== lastG) { tb.append(h('tr', { class: 'grp' }, h('td', { colspan: 7, text: r.g }))); lastG = r.g; }
      const dcell = (d) => h('td', { class: d > 0 ? 'pos' : d < 0 ? 'neg' : '' }, d == null ? '–' : (d > 0 ? '+' : '') + fmt(d));
      tb.append(h('tr', { title: r.key ? watchKind(r.key) : '' },
        h('td', {}, r.name, r.key ? h('div', { class: 'mono small muted', text: r.key }) : null),
        h('td', { text: fmt(r.sa.max) }), h('td', { text: fmt(r.sb.max) }),
        h('td', { class: r.dmax > 0 ? 'pos' : r.dmax < 0 ? 'neg' : '' }, r.dmax == null ? '–' : (r.dmax > 0 ? '+' : '') + fmt(r.dmax), scaleD && r.dmax != null ? h('span', { class: 'diffbar', style: `width:${(Math.abs(r.dmax) / scaleD) * 40}px;background:${r.dmax > 0 ? `rgb(${roleRGB('generated')})` : 'var(--s1)'}` }) : null),
        h('td', { text: fmt(r.sa.mean) }), h('td', { text: fmt(r.sb.mean) }), dcell(r.dmean)));
    }
  };
  addRows(ax, null); addRows(wf, maxD);
  tableCard.append(
    h('div', { class: 'row' }, h('h2', { class: 'grow', text: 'Watched features: A vs B' }), h('span', { class: 'small muted', text: 'over' }),
      seg('region', [['all', 'all'], ['prompt', 'prompt'], ['lastuser', 'last user →'], ['reply', 'reply']])),
    h('div', { class: 'tblwrap' }, h('table', { class: 'tbl' },
      h('thead', {}, h('tr', {}, h('th', { text: 'feature' }), h('th', { text: 'max A' }), h('th', { text: 'max B' }), h('th', { text: 'Δ max (B−A)' }), h('th', { text: 'mean A' }), h('th', { text: 'mean B' }), h('th', { text: 'Δ mean' }))), tb)),
    h('p', { class: 'desc', text: 'Watched features sorted by |Δ max|. Positive (orange) = stronger in B. <bos> is excluded from all statistics.' }));
}

/* ====================================================================
   8. RUNS & NOTES
   ==================================================================== */
function renderRuns() {
  const sec = $('#v-runs'); sec.innerHTML = '';
  const runsCard = h('div', { class: 'card' }, h('div', { class: 'row' }, h('h2', { class: 'grow', text: 'Runs' }), h('button', { class: 'btn sm', text: 'Refresh', onclick: refreshRuns })));
  if (!S.runs.length) runsCard.append(h('div', { class: 'muted small', text: 'No runs yet.' }));
  for (const r of S.runs) {
    runsCard.append(h('div', { class: 'item' + (S.run && S.run.id === r.id ? ' cur' : '') },
      h('div', { class: 'row tight' }, h('b', { text: r.id }), r.label ? h('span', { text: r.label }) : null, h('span', { class: 'meta grow', text: r.created || '' }),
        h('button', { class: 'btn sm primary', text: 'Open', onclick: () => loadRun(r.id) }),
        h('button', { class: 'btn sm', title: 'Use as compare A', text: 'A', onclick: () => { S.cmp.a = r.id; setTab('compare'); } }),
        h('button', { class: 'btn sm', title: 'Use as compare B', text: 'B', onclick: () => { S.cmp.b = r.id; setTab('compare'); } })),
      r.first_user ? h('div', { class: 'txt' }, h('span', { class: 'muted', text: 'user: ' }), r.first_user) : null,
      r.reply_start ? h('div', { class: 'txt' }, h('span', { class: 'muted', text: 'reply: ' }), r.reply_start) : null));
  }
  // notes
  const ta = h('textarea', { rows: 3, placeholder: S.run ? `Note about ${S.run.id} (captures the current view)` : 'Note (no run loaded)' });
  const onlyCur = h('input', { type: 'checkbox', checked: !!S._notesOnlyCur, onchange: (e) => { S._notesOnlyCur = e.target.checked; renderRuns(); } });
  const notesCard = h('div', { class: 'card' },
    h('div', { class: 'row' }, h('h2', { class: 'grow', text: 'Notes' }), h('label', { class: 'row tight small muted' }, onlyCur, 'this run only'), h('button', { class: 'btn sm', text: 'Refresh', onclick: refreshNotes })),
    ta, h('div', { class: 'row', style: 'margin:6px 0 10px' }, h('span', { class: 'small muted grow', text: viewSummary(captureView()) }), h('button', { class: 'btn primary', text: 'Save note', onclick: async (e) => { if (await saveNote(ta.value, e.target)) ta.value = ''; } })));
  let notes = S.notes || [];
  if (S._notesOnlyCur && S.run) notes = notes.filter((n) => n.run === S.run.id);
  if (!notes.length) notesCard.append(h('div', { class: 'muted small', text: 'No notes yet.' }));
  for (const n of notes) {
    const v = n.view && typeof n.view === 'object' ? n.view : null;
    notesCard.append(h('div', { class: 'item' },
      h('div', { class: 'row tight' }, h('span', { class: 'meta grow', text: [n.created || n.time || '', n.run ? 'run ' + n.run : ''].filter(Boolean).join(' · ') }),
        v ? h('button', { class: 'btn sm', text: 'Open view', title: viewSummary(v), onclick: () => restoreView(v, n.run) }) : null),
      h('div', { class: 'txt', text: n.text || '' }),
      v ? h('div', { class: 'meta', text: viewSummary(v) }) : null));
  }
  sec.append(h('div', { class: 'cols two' }, runsCard, notesCard));
}
function captureView() {
  const run = S.run;
  return {
    tab: S.tab, run: run ? run.id : null,
    sel: S.sel, token: run && S.sel != null && run.tokens[S.sel] ? run.tokens[S.sel].text : null,
    role: run && S.sel != null && run.tokens[S.sel] ? run.tokens[S.sel].role : null,
    layer: S.layer, axisLayer: S.axisLayer, normLayer: S.normLayer, lensLayer: S.lensLayer,
    measure: S.measure, heat: { ...S.heat }, cell_open: S.cellOpen, attnHead: S.attnHead,
    step: S.step, watchFilter: S.watchFilter, watchSort: S.watchSort,
    compare: { a: S.cmp.a, b: S.cmp.b, axis: S.cmp.axis, layer: S.cmp.layer, align: S.cmp.align, region: S.cmp.region },
  };
}
function viewSummary(v) {
  if (!v) return '';
  const parts = [v.tab || '?'];
  if (v.run) parts.push(v.run);
  if (v.sel != null) parts.push(`#${v.sel}${v.token != null ? ' "' + showTok(v.token) + '"' : ''}`);
  if (v.tab === 'tokens' && v.measure) parts.push(v.measure + (String(v.measure).startsWith('axis:') ? '@L' + v.axisLayer : ''));
  if (v.tab === 'heat' && v.heat) parts.push(v.heat.mode);
  if (v.cell_open) parts.push('cell L' + v.layer);
  if (v.tab === 'steps') parts.push('step ' + ((v.step || 0) + 1));
  if (v.tab === 'compare' && v.compare) parts.push(`${v.compare.a} vs ${v.compare.b}`);
  return parts.join(' · ');
}
async function saveNote(text, btn) {
  text = (text || '').trim(); if (!text) { toast('Write something first', true); return false; }
  const view = captureView();
  if (btn) btn.disabled = true;
  try { await api('note', { method: 'POST', body: { run: view.run, text, view } }); toast('Note saved'); refreshNotes(); return true; }
  catch (e) { toast('Note failed: ' + e.message, true); return false; }
  finally { if (btn) btn.disabled = false; }
}
async function restoreView(v, runId) {
  const id = v.run || runId;
  if (id && (!S.run || S.run.id !== id)) { try { await loadRun(id, { keepView: true }); } catch (e) { return; } }
  for (const k of ['layer', 'axisLayer', 'normLayer', 'lensLayer', 'measure', 'step', 'watchFilter', 'watchSort']) if (v[k] != null) S[k] = v[k];
  if (v.heat) Object.assign(S.heat, v.heat);
  if (v.attnHead != null) S.attnHead = v.attnHead;
  if (v.compare) Object.assign(S.cmp, v.compare);
  valCache.clear();
  if (S.run && v.sel != null) S.sel = clamp(v.sel, 0, S.run.tokens.length - 1);
  if (S.run && !measureDefs().some((d) => d.id === S.measure)) S.measure = 'axis:char';
  setTab(v.tab && v.tab !== 'cell' ? v.tab : 'tokens');
  if (v.cell_open) openCell(); else if (S.cellOpen) closeCell();
}
function openNoteDlg() {
  if ($('#notedlg')) return;
  const view = captureView();
  const ta = h('textarea', { rows: 5, placeholder: 'What do you see here?' });
  const close = () => m.remove();
  const m = h('div', { class: 'modal', id: 'notedlg', onclick: (e) => { if (e.target === m) close(); } }, h('div', { class: 'sheet' },
    h('div', { class: 'row' }, h('h2', { class: 'grow', text: 'Note' }), h('button', { class: 'btn sm icon ghost', text: '✕', title: 'Close', onclick: close })),
    h('div', { class: 'small muted', style: 'margin-bottom:6px' }, 'Captures: ', h('span', { class: 'mono', text: viewSummary(view) || 'no run' })),
    ta,
    h('div', { class: 'row', style: 'margin-top:8px;justify-content:flex-end' },
      h('span', { class: 'small muted grow', text: 'Ctrl/⌘+Enter to save' }),
      h('button', { class: 'btn', text: 'Cancel', onclick: close }),
      h('button', { class: 'btn primary', text: 'Save note', id: 'notesave', onclick: async (e) => { if (await saveNote(ta.value, e.target)) close(); } }))));
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#notesave').click(); });
  document.body.append(m); setTimeout(() => ta.focus(), 30);
}

/* ====================================================================
   Boot
   ==================================================================== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#notedlg')) $('#notedlg').remove(); else if (S.cellOpen) closeCell(); return; }
  if ((e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) || e.ctrlKey || e.metaKey || e.altKey || !S.run) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (S.tab === 'steps') { S.step--; renderSteps(); setSel(S.run.steps[clamp(S.step, 0, S.run.steps.length - 1)].pos, { fromSteps: true }); } else setSel(S.sel - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); if (S.tab === 'steps') { S.step++; renderSteps(); setSel(S.run.steps[clamp(S.step, 0, S.run.steps.length - 1)].pos, { fromSteps: true }); } else setSel(S.sel + 1); }
  else if (S.cellOpen && e.key === 'ArrowUp') { e.preventDefault(); setLayer(S.layer + 1); }
  else if (S.cellOpen && e.key === 'ArrowDown') { e.preventDefault(); setLayer(S.layer - 1); }
  else if (e.key === 'n') { e.preventDefault(); openNoteDlg(); }
});
let lastW = innerWidth;
addEventListener('resize', debounce(() => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; if (['tokens', 'compare', 'heat'].includes(S.tab)) renderView(); }, 150));
darkMQ.addEventListener && darkMQ.addEventListener('change', () => { renderView(); if (S.cellOpen) renderCell(); });
$('#fab').addEventListener('click', openNoteDlg);
$('#runchip').addEventListener('click', () => setTab('runs'));

async function boot() {
  buildNav();
  const prefs = loadPrefs();
  for (const k of ['axisLayer', 'layer', 'normLayer', 'lensLayer', 'measure', 'chartRange', 'attnHideBos', 'watchSort', 'watchRegion']) if (prefs[k] != null) S[k] = prefs[k];
  if (prefs.heat) Object.assign(S.heat, prefs.heat);
  if (prefs.cmp) Object.assign(S.cmp, prefs.cmp);
  $('#v-prompt').append(h('div', { class: 'card muted' }, h('span', { class: 'spinner' }), ' Connecting to the explorer backend…'));
  try { S.meta = await api('meta'); }
  catch (e) {
    $('#v-prompt').innerHTML = '';
    $('#v-prompt').append(h('div', { class: 'card' }, h('h2', { text: 'Cannot reach the backend' }), h('p', { class: 'muted', text: e.message + ' · Is the server cell in the notebook still running? Re-run it, then retry.' }),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', text: 'Retry', onclick: () => location.reload() }))));
    return;
  }
  S.draft = prefs.draft && Array.isArray(prefs.draft.messages) ? Object.assign(defaultDraft(), prefs.draft) : defaultDraft();
  if (!Array.isArray(S.draft.steer)) S.draft.steer = [];
  refreshNotes();
  try { S.runs = (await api('runs')) || []; } catch (e) { toast('Runs: ' + e.message, true); }
  let tab = 'prompt';
  if (prefs.lastRun) {
    try { const r = await getRun(prefs.lastRun); acceptRun(r, false); if (prefs.sel != null) S.sel = clamp(prefs.sel, 0, r.tokens.length - 1); tab = prefs.tab && prefs.tab !== 'cell' ? prefs.tab : 'tokens'; }
    catch (e) { /* run gone */ }
  }
  updateRunChip();
  setTab(tab);
}
boot();
